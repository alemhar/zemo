<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title></title>
<style>
  /* Everything below must composite over a genuinely transparent surface.
     If any ancestor paints a background, the spike result is meaningless. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  :root { --accent: #FFC20E; }   /* bumblebee yellow */

  /* Crosshair only while a tool is armed, so the cursor itself signals state. */
  body.armed { cursor: crosshair; }

  /* ── Test graphics (the share-visibility markers) ────────────────────────── */

  .frame {
    position: fixed; inset: 0;
    border: 6px solid var(--accent);
    box-sizing: border-box;
    opacity: .75;
  }

  .corner { position: fixed; width: 90px; height: 90px; border: 6px solid var(--accent); }
  .tl { top: 24px; left: 24px; border-right: 0; border-bottom: 0; }
  .tr { top: 24px; right: 24px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 24px; left: 24px; border-right: 0; border-top: 0; }
  .br { bottom: 24px; right: 24px; border-left: 0; border-top: 0; }

  .center {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.9);
  }
  .headline { font-size: 54px; font-weight: 800; letter-spacing: -1px; color: var(--accent); margin: 0 0 6px; }
  .sub { font-size: 22px; font-weight: 600; color: #fff; margin: 0 0 22px; }

  /* Live clock with milliseconds: a frozen or cached frame is immediately
     obvious to the person watching the share. */
  .clock {
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 40px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,.55);
    padding: 10px 22px; border-radius: 10px;
    display: inline-block; border: 2px solid var(--accent);
  }

  .track { position: fixed; left: 0; right: 0; top: 140px; height: 34px; }
  .dot {
    position: absolute; top: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 22px var(--accent);
    animation: sweep 3.2s linear infinite;
  }
  @keyframes sweep { 0% { left: 0 } 50% { left: calc(100% - 34px) } 100% { left: 0 } }

  .sample { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); }

  /* ── Text box ────────────────────────────────────────────────────────────── */
  /* Lives inside an SVG <foreignObject>: SVG text has no wrapping, but an HTML
     div wraps for free and is editable. Styles apply normally because the div
     is real HTML in this document. */
  .textbox {
    width: 100%; height: 100%;
    box-sizing: border-box;
    padding: 4px 7px;
    /* Handwriting, from what Windows actually ships. Ink Free is the Win10/11
       face; Segoe Script and Print cover older installs; Comic Sans is the
       last resort that is genuinely always present. */
    font: 400 30px/1.28 "Ink Free", "Segoe Script", "Segoe Print",
          "Comic Sans MS", cursive;
    /* Committed text keeps a barely-there dashed container so you can see
       where it ends; drawing or typing promotes it to a real guide. */
    border: 1px dashed var(--faint, rgba(128,128,128,.3));
    border-radius: 4px;
    background: transparent;
    outline: none;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    overflow: hidden;
  }
  /* While the caret is in the box: show the container so the writer can see
     where the text will wrap, and sit it on a scrim so the caret is findable. */
  .textbox:focus,
  .textbox.drawing {
    border: 2px dashed currentColor;
    background: var(--edit-bg, rgba(0,0,0,.4));
  }

  /* Drag handle. Only grabbable while armed, and invisible otherwise, so the
     call never sees editing furniture around your notes. */
  .grip {
    opacity: 0;
    pointer-events: none;
    cursor: move;
    transition: opacity .12s ease;
  }
  body.armed .grip { opacity: .55; pointer-events: auto; }
  body.armed .grip:hover { opacity: 1; }
  .textbox:empty::before {
    content: "type…";
    opacity: .4;
  }

  /* ── Click ripples (PRD R6.6) ────────────────────────────────────────────── */
  /* Driven by a Win32 mouse hook, not pointer events: the overlay is
     click-through while this is on, so it never sees the mouse itself.
     A cursor halo (R6.5) was built and removed — any glow bright enough to
     notice also washed out the text underneath it. Ripples cost nothing
     visually because they are gone 0.6s after the click. */
  .ripple {
    position: fixed; border-radius: 50%;
    border: 4px solid currentColor;
    pointer-events: none;
    animation: ripple .62s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes ripple {
    0%   { width: 12px; height: 12px; margin: -6px 0 0 -6px;   opacity: .95 }
    100% { width: 112px; height: 112px; margin: -56px 0 0 -56px; opacity: 0 }
  }

  /* ── Spotlight ───────────────────────────────────────────────────────────── */
  /* Sits under #draw so annotations stay bright on top of the dim (PRD R6.10). */
  #spot { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
  #spot.on { display: block; }

  /* ── Drawing surface ─────────────────────────────────────────────────────── */

  #draw { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* Capture confirmation.
     An edge pulse was tried and dropped: the test-graphics frame already
     breathes on a 2s loop, so another pulsing border read as more of the same.
     A card that punches in and settles is a different KIND of motion, which is
     what makes it register as an event rather than ambience. */
  #shutter {
    position: fixed; inset: 0;
    border: 16px solid #fff;
    box-sizing: border-box;
    box-shadow: inset 0 0 50px rgba(255,255,255,.5);
    opacity: 0; pointer-events: none;
  }
  #shutter.fire { animation: shutter .5s ease-out; }
  @keyframes shutter {
    0%   { opacity: 0 }
    15%  { opacity: 1 }
    100% { opacity: 0 }
  }

  /* Toast sits top-centre, clear of the centred test graphics that were
     swallowing it before. */
  #flash {
    position: fixed; top: 60px; left: 50%;
    background: #0d1014; color: #fff;
    padding: 20px 34px; border-radius: 16px;
    font-size: 24px; font-weight: 800; text-align: center;
    border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(255,255,255,.20), 0 22px 60px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, 0) scale(.6);
  }
  #flash.show { animation: punch 2.4s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes punch {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.6) }
    12%  { opacity: 1; transform: translate(-50%, 0) scale(1.06) }
    20%  { opacity: 1; transform: translate(-50%, 0) scale(1) }
    80%  { opacity: 1; transform: translate(-50%, 0) scale(1) }
    100% { opacity: 0; transform: translate(-50%, 0) scale(1) }
  }
  #flash small {
    display: block; font-weight: 400; font-size: 14px;
    opacity: .75; margin-top: 7px; letter-spacing: .2px;
  }

  /* Status chip. Sits bottom-centre so it reads as a caption rather than
     competing with whatever is being annotated. */
  .legend {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    font-size: 16px; color: #fff; background: rgba(0,0,0,.6);
    padding: 8px 18px; border-radius: 8px; letter-spacing: .3px;
    white-space: nowrap;
  }
  .legend b { color: var(--accent); }
</style>
</head>
<body>
  <div id="testgfx">
    <div class="frame"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="track"><div class="dot"></div></div>

    <div class="center">
      <p class="headline">ZEMO OVERLAY</p>
      <p class="sub">If you can read this on the shared screen, Phase&nbsp;0 PASSES</p>
      <div class="clock" id="clock">--:--:--.---</div>
    </div>

    <svg class="sample" width="300" height="90" viewBox="0 0 300 90" fill="none">
      <!-- Tail-first arrow (PRD R6.0): drag from the start toward the target. -->
      <path d="M14 45 L120 45" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
      <path d="M8 45 L48 24 L40 45 L48 66 Z" fill="var(--accent)"/>
      <text x="140" y="54" fill="#fff" font-size="26" font-weight="700"
            style="text-shadow:0 2px 10px rgba(0,0,0,.9)">drag to point</text>
    </svg>
  </div>

  <svg id="spot">
    <defs>
      <!-- White keeps the dim, black punches the hole through it. A soft edge
           reads as a light cone rather than a cookie-cutter circle. -->
      <radialGradient id="falloff">
        <stop offset="70%" stop-color="black" stop-opacity="1"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <mask id="spotmask">
        <rect width="100%" height="100%" fill="white"/>
        <circle id="hole" cx="50%" cy="50%" r="160" fill="url(#falloff)"/>
      </mask>
    </defs>
    <rect width="100%" height="100%" fill="rgba(0,0,0,.62)" mask="url(#spotmask)"/>
  </svg>

  <!-- Drawn shapes live here. Above the test graphics so annotations always win. -->
  <svg id="draw"></svg>

  <div class="legend" id="legend">overlay • click-through • NOT capture-excluded</div>
  <div id="shutter"></div>
  <div id="flash"></div>

<script>
  const { event, core } = window.__TAURI__ ?? {};
  const jlog = (m) => core?.invoke("log_js", { msg: m }).catch(() => {});
  window.addEventListener("error", (e) => jlog(`JS ERROR: ${e.message} @${e.lineno}`));
  // A throw inside an event callback surfaces as a rejected promise, not a
  // window error — without this it fails completely silently.
  window.addEventListener("unhandledrejection", (e) =>
    jlog(`JS REJECTION: ${e.reason}`));
  const invoke = core?.invoke;
  const SVG_NS = "http://www.w3.org/2000/svg";

  const draw = document.getElementById("draw");
  const legend = document.getElementById("legend");
  const testgfx = document.getElementById("testgfx");

  let tool = "none";
  let stroke = 6;

  // Single-letter tool keys (PRD §6.3). Safe unmodified because the overlay only
  // holds focus while armed, so these can never leak into the app underneath.
  const TOOL_KEYS = { a: "arrow", r: "rect", o: "ellipse", p: "pen", t: "text" };

  // True while a text box has the caret. Every keyboard shortcut is suppressed
  // during that time — otherwise typing "a rectangle" would switch tools four
  // times and delete a mark.
  let editing = false;
  // Bumblebee yellow leads: it reads clearly over both dark IDEs and white
  // documents, which red and blue do not do equally well.
  const PALETTE = [
    { key: "1", name: "bumblebee", hex: "#FFC20E" },
    { key: "2", name: "red",       hex: "#FF2D2D" },
    { key: "3", name: "light blue", hex: "#4FC3F7" },
    { key: "4", name: "white",     hex: "#FFFFFF" },
    { key: "5", name: "black",     hex: "#000000" },
  ];

  let accent = () =>
    getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#FFC20E";

  /** Perceived brightness, 0–1. Used to decide what a colour needs behind it. */
  function luminance(hex) {
    const h = hex.replace("#", "");
    const n = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(n.slice(i, i + 2), 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  // Marks are drawn with no halo at all. The PRD called for one (R6.3) to keep
  // colours legible over arbitrary UI, but in practice it looked worse than the
  // problem it solved: the halo is a wider copy of the same shape, so an
  // arrow's halo head sits further back than the real head and pokes out the
  // side. The palette is high-contrast enough to carry itself.

  // ── Clock ──────────────────────────────────────────────────────────────────
  const clock = document.getElementById("clock");
  (function tick() {
    const d = new Date();
    const p = (n, w = 2) => String(n).padStart(w, "0");
    clock.textContent =
      `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
    requestAnimationFrame(tick);
  })();

  // ── Shape builders ─────────────────────────────────────────────────────────
  // Each returns an SVG element and exposes update(a, b) so the same code path
  // drives the live preview and the committed shape.

  function el(name, attrs) {
    const n = document.createElementNS(SVG_NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // A dark halo under every mark so red-on-red stays legible over arbitrary UI
  // (PRD R6.3). Drawn as a wider shape of the same geometry, underneath.
  function haloed(make) {
    const g = el("g", {});
    const main = make(accent(), stroke);
    g.append(main);
    return { node: g, parts: [main] };
  }

  function makeRect() {
    const s = haloed((color, w) =>
      el("rect", { fill: "none", stroke: color, "stroke-width": w, rx: 3 }));
    s.update = (a, b) => {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
      const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
      s.parts.forEach((p) => {
        p.setAttribute("x", x); p.setAttribute("y", y);
        p.setAttribute("width", w); p.setAttribute("height", h);
      });
    };
    return s;
  }

  function makeEllipse() {
    const s = haloed((color, w) =>
      el("ellipse", { fill: "none", stroke: color, "stroke-width": w }));
    s.update = (a, b) => {
      s.parts.forEach((p) => {
        p.setAttribute("cx", (a.x + b.x) / 2); p.setAttribute("cy", (a.y + b.y) / 2);
        p.setAttribute("rx", Math.abs(b.x - a.x) / 2); p.setAttribute("ry", Math.abs(b.y - a.y) / 2);
      });
    };
    return s;
  }

  function makePen() {
    const pts = [];
    const s = haloed((color, w) =>
      el("polyline", { fill: "none", stroke: color, "stroke-width": w,
                       "stroke-linecap": "round", "stroke-linejoin": "round" }));
    s.update = (a, b) => {
      pts.push(`${b.x},${b.y}`);
      s.parts.forEach((p) => p.setAttribute("points", pts.join(" ")));
    };
    return s;
  }

  /**
   * Tail-first arrow (PRD R6.0): press where the arrow starts, drag to the
   * thing you're pointing at. Matches every other drawing app, so there's
   * nothing to unlearn.
   */
  function makeArrow() {
    const s = haloed((color, w) => {
      const g = el("g", {});
      g.append(
        el("line", { stroke: color, "stroke-width": w, "stroke-linecap": "round" }),
        el("polygon", { fill: color })
      );
      return g;
    });
    s.update = (tail, head) => {
      const dx = head.x - tail.x, dy = head.y - tail.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;

      const last = s.parts.length - 1;
      s.parts.forEach((g, i) => {
        const w = i === last ? stroke : stroke + 3;
        const headLen = w * 3.2, headHalf = w * 1.9;
        // Stop the shaft at the base of the head so it doesn't poke through.
        const bx = head.x - ux * headLen, by = head.y - uy * headLen;
        const [line, poly] = g.children;
        line.setAttribute("x1", tail.x); line.setAttribute("y1", tail.y);
        line.setAttribute("x2", bx);     line.setAttribute("y2", by);
        // Perpendicular, for the two back corners of the head.
        const px = -uy, py = ux;
        poly.setAttribute("points", [
          `${head.x},${head.y}`,
          `${bx + px * headHalf},${by + py * headHalf}`,
          `${bx - px * headHalf},${by - py * headHalf}`,
        ].join(" "));
      });
    };
    return s;
  }

  const XHTML_NS = "http://www.w3.org/1999/xhtml";

  /**
   * Text box. Drag out the container; whatever you type wraps inside it.
   * The box grows downward if the text outruns the height you dragged, so a
   * misjudged drag doesn't silently clip what you wrote.
   */
  /** `#rrggbb` to an rgba() string, for tinting borders from the ink colour. */
  function rgba(hex, a) {
    const h = hex.replace("#", "");
    const n = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(n.slice(i, i + 2), 16));
    return `rgba(${r},${g},${b},${a})`;
  }

  function makeText() {
    const g = el("g", {});
    const fo = el("foreignObject", {});
    const div = document.createElementNS(XHTML_NS, "div");
    div.setAttribute("contenteditable", "true");
    div.setAttribute("class", "textbox");
    const colour = accent();
    div.style.color = colour;
    // With the panel gone, a tight shadow is what keeps the text readable over
    // arbitrary screen content. Opposite brightness to the ink, same rule the
    // marks use — but on type it reads as weight rather than as an outline.
    const light = luminance(colour) > 0.5;
    div.style.textShadow = light
      ? "0 1px 3px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.7)"
      : "0 1px 3px rgba(255,255,255,.95), 0 0 2px rgba(255,255,255,.8)";
    div.style.setProperty(
      "--edit-bg", light ? "rgba(0,0,0,.45)" : "rgba(255,255,255,.55)");
    div.style.setProperty("--faint", rgba(colour, 0.32));
    fo.appendChild(div);

    const grip = el("rect", { class: "grip", width: 18, height: 18, rx: 4 });
    grip.setAttribute("fill", colour);
    grip.setAttribute("stroke", "rgba(0,0,0,.35)");
    g.append(fo, grip);

    // Shown while the area is being dragged out; cleared once committed.
    div.classList.add("drawing");

    const s = { node: g, div, fo, grip, isText: true, box: { x: 0, y: 0, w: 0, h: 0 } };

    /** Single place that moves the box, so the grip can never drift off it. */
    s.place = (x, y, w, h) => {
      s.box = { x, y, w, h };
      fo.setAttribute("x", x);
      fo.setAttribute("y", y);
      fo.setAttribute("width", w);
      fo.setAttribute("height", h);
      // Sits just outside the top-left corner, clear of the first character.
      grip.setAttribute("x", x - 10);
      grip.setAttribute("y", y - 10);
    };
    grip.__shape = s;

    s.update = (a, b) => s.place(
      Math.min(a.x, b.x),
      Math.min(a.y, b.y),
      Math.max(Math.abs(b.x - a.x), 120),
      Math.max(Math.abs(b.y - a.y), 46),
    );

    div.addEventListener("focus", () => { editing = true; renderLegend(); });
    div.addEventListener("blur", () => {
      editing = false;
      renderLegend();
      // An empty box is almost always an accidental click; drop it rather than
      // leaving an empty frame on screen.
      if (!div.textContent.trim()) {
        const i = shapes.indexOf(s);
        if (i >= 0) { shapes.splice(i, 1); syncCount(); }
        fo.remove();
      }
    });
    // foreignObject clips its content, so grow to fit instead of hiding text.
    div.addEventListener("input", () => {
      const needed = div.scrollHeight;
      if (needed > s.box.h) s.place(s.box.x, s.box.y, s.box.w, needed);
    });

    return s;
  }

  const BUILDERS = {
    rect: makeRect, ellipse: makeEllipse, arrow: makeArrow, pen: makePen, text: makeText,
  };

  // ── Shape list ─────────────────────────────────────────────────────────────
  // Kept in draw order so marks can be retired from either end: newest-first
  // (undo) or oldest-first (drain the sequence in the order you drew it).
  const shapes = [];

  function syncCount() {
    invoke?.("report_count", { count: shapes.length }).catch(() => {});
  }

  function removeNewest() {
    shapes.pop()?.node.remove();
    syncCount();
  }

  function removeOldest() {
    shapes.shift()?.node.remove();
    syncCount();
  }

  function clearAll() {
    shapes.length = 0;
    draw.replaceChildren();
    syncCount();
  }

  // ── Drawing interaction ────────────────────────────────────────────────────
  let active = null;
  let start = null;
  let drag = null;          // { shape, dx, dy } while a text box is being moved

  const pos = (e) => ({ x: e.clientX, y: e.clientY });

  window.addEventListener("pointerdown", (e) => {
    if (tool === "none" || !BUILDERS[tool]) return;
    if (e.button !== 0) return;
    // Grabbing a handle moves that box instead of drawing a new shape.
    const grabbed = e.target.__shape;
    if (grabbed) {
      drag = { shape: grabbed, dx: e.clientX - grabbed.box.x, dy: e.clientY - grabbed.box.y };
      e.preventDefault();
      return;
    }
    // Clicking an existing text box should put the caret in it, not start a
    // new shape on top of it.
    if (e.target.closest?.(".textbox")) return;
    start = pos(e);
    try {
      active = BUILDERS[tool]();
    } catch (err) {
      invoke?.("log_js", { msg: `BUILDER ${tool} THREW: ${err}` }).catch(() => {});
      return;
    }
    active.update(start, start);
    draw.appendChild(active.node);
    window.setPointerCapture?.call(e.target, e.pointerId);
  });

  window.addEventListener("pointermove", (e) => {
    if (drag) {
      const { shape, dx, dy } = drag;
      shape.place(e.clientX - dx, e.clientY - dy, shape.box.w, shape.box.h);
      return;
    }
    if (!active) return;
    active.update(start, pos(e));
  });

  window.addEventListener("pointerup", () => {
    if (drag) { drag = null; return; }
    if (!active) return;

    if (active.isText) {
      // A tap with no real drag means "put a box here" — give it a usable
      // default rather than a 120px sliver.
      if (active.box.w <= 120) {
        active.place(active.box.x, active.box.y, 380, 110);
      }
      active.div.classList.remove("drawing");
      shapes.push(active);
      syncCount();
      const d = active.div;
      // Focus after the current event settles, or the pointerup steals it back.
      setTimeout(() => d.focus(), 0);
      active = null;
      start = null;
      return;
    }

    // A click with no drag leaves a degenerate shape; drop it.
    const b = active.node.getBBox();
    if (b.width < 3 && b.height < 3) {
      active.node.remove();
    } else {
      shapes.push(active);
      syncCount();
    }
    active = null;
    start = null;
  });

  // Right-click cancels whatever is mid-draw without committing (R6.0.3).
  window.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    if (active) { active.node.remove(); active = null; start = null; }
  });

  window.addEventListener("keydown", (e) => {
    // While typing, the overlay's shortcuts must stay out of the way entirely.
    if (editing) {
      if (e.key === "Escape") {
        document.activeElement?.blur();
        e.preventDefault();
      }
      return;
    }

    if (e.key === "Escape") {
      if (active) { active.node.remove(); active = null; start = null; return; }
      invoke?.("set_tool", { tool: "none" });   // hand control back to the desktop
      return;
    }
    // Unmodified shortcuts work here because the overlay only has focus while
    // armed — they can't leak into the app underneath.
    if (e.ctrlKey && e.key.toLowerCase() === "z") { removeNewest(); return; }
    if (e.key === "Backspace") { removeNewest(); return; }
    if (e.key === "Home") { removeOldest(); return; }

    // Tool switching. Ignored while a modifier is held so the global
    // Ctrl+Alt+* bindings keep their meaning.
    if (!e.ctrlKey && !e.altKey && !e.metaKey) {
      const next = TOOL_KEYS[e.key.toLowerCase()];
      // Round-trip through the backend so the control panel stays in sync.
      if (next && next !== tool) { invoke?.("set_tool", { tool: next }); return; }

      const swatch = PALETTE.find((c) => c.key === e.key);
      if (swatch) invoke?.("set_overlay_color", { color: swatch.hex });
    }
  });

  // ── Click ripples ──────────────────────────────────────────────────────────
  // Left and right get different colours so a viewer can tell which button was
  // used — the point of ripples in a walkthrough (PRD R6.6).
  const RIPPLE_COLOUR = { left: "#FFC20E", right: "#4FC3F7", middle: "#FFFFFF" };

  function ripple(x, y, button) {
    const r = document.createElement("div");
    r.className = "ripple";
    r.style.left = `${x}px`;
    r.style.top = `${y}px`;
    // `currentColor` in the border picks this up.
    r.style.color = RIPPLE_COLOUR[button] ?? RIPPLE_COLOUR.left;
    document.body.appendChild(r);
    r.addEventListener("animationend", () => r.remove());
  }

  // ── Spotlight ──────────────────────────────────────────────────────────────
  const spot = document.getElementById("spot");
  const hole = document.getElementById("hole");
  let spotR = 160;
  const SPOT_MIN = 60, SPOT_MAX = 520, SPOT_STEP = 40;

  function moveSpot(x, y) {
    hole.setAttribute("cx", x);
    hole.setAttribute("cy", y);
  }

  // ── State from the control panel ───────────────────────────────────────────
  const TOOL_HINT = "<b>A</b>rrow <b>R</b>ect <b>O</b>val <b>P</b>en <b>T</b>ext";

  function renderLegend() {
    if (editing) {
      // The one state where the shortcuts are deliberately dead, so say so.
      legend.innerHTML = `<b>typing</b> • Esc finishes • then ${TOOL_HINT} to draw`;
    } else if (tool === "none") {
      legend.innerHTML = "overlay • click-through • NOT capture-excluded";
    } else {
      legend.innerHTML = `drawing: <b>${tool}</b> • ${TOOL_HINT} • Esc exits`;
    }
  }

  function setTool(next) {
    invoke?.("log_js", { msg: `setTool -> ${next}` }).catch(() => {});
    tool = next;
    document.body.classList.toggle("armed", tool !== "none");
    renderLegend();
  }
  setTool("none");

  if (event) {
    event.listen("set-color", (e) => {
      document.documentElement.style.setProperty("--accent", e.payload);
    });
    event.listen("set-tool", (e) => setTool(e.payload));
    event.listen("set-stroke", (e) => { stroke = e.payload; });
    event.listen("clear-shapes", () => clearAll());
    event.listen("remove-shape", (e) => {
      if (e.payload === "oldest") removeOldest();
      else removeNewest();
    });
    event.listen("test-graphics", (e) => {
      testgfx.style.display = e.payload ? "" : "none";
    });

    // Shown AFTER the shot is taken, so the confirmation can't appear in it.
    event.listen("flash", (e) => {
      jlog(`flash received: ${JSON.stringify(e.payload)}`);
      const [path, clipped] = Array.isArray(e.payload)
        ? e.payload
        : [String(e.payload ?? ""), false];

      const sh = document.getElementById("shutter");
      sh.classList.remove("fire");
      void sh.offsetWidth;          // restart cleanly on rapid repeats
      sh.classList.add("fire");

      const el = document.getElementById("flash");
      el.innerHTML =
        `📸 Screenshot saved${clipped ? " + copied" : ""}<small>${path}</small>`;
      // Restart the animation cleanly when captures come in quick succession.
      el.classList.remove("show");
      void el.offsetWidth;
      el.classList.add("show");
    });

    event.listen("spotlight", (e) => spot.classList.toggle("on", !!e.payload));

    event.listen("spotlight-size", (e) => {
      spotR = Math.min(SPOT_MAX, Math.max(SPOT_MIN, spotR + e.payload * SPOT_STEP));
      hole.setAttribute("r", spotR);
    });

    // Cursor comes from a Win32 hook, in physical pixels relative to the
    // monitor origin. CSS pixels are what the SVG wants, hence the DPR divide.
    event.listen("cursor", (e) => {
      const [px, py] = e.payload;
      const dpr = window.devicePixelRatio || 1;
      const x = px / dpr, y = py / dpr;
      moveSpot(x, y);
    });

    event.listen("click", (e) => {
      const [px, py, button] = e.payload;
      const dpr = window.devicePixelRatio || 1;
      ripple(px / dpr, py / dpr, button);
    });
  }
</script>
</body>
</html>
