[package]
name = "zemo"
version = "0.1.2"
description = "A transparent, always-on-top screen annotation overlay for video calls"
authors = ["Alemhar Salihuddin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "zemo"
path = "src/main.rs"

# Diagnostic kept from the Phase 0 spike: grabs one frame through the same
# capture API Teams and Zoom use, to check the overlay is actually in it.
[[bin]]
name = "capture-probe"
path = "src/bin/capture_probe.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"
image = "0.25"

[profile.dev]
debug = 0
split-debuginfo = "unpacked"
