<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Zemo shortcuts</title>
<style>
  /* Transparent window so the card can have rounded corners and a shadow. */
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
  }

  .card {
    position: absolute; inset: 10px;
    background: #14161a;
    border: 1px solid #2c313b;
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    color: #e8eaed;
    padding: 20px 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  h1 { font-size: 16px; margin: 0; }
  .dismiss { font-size: 12px; color: #959cab; margin-left: auto; }
  .lede { font-size: 12px; color: #959cab; margin: 0 0 14px; }

  .scroll { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: #959cab; margin: 14px 0 8px;
  }
  h2:first-child { margin-top: 0; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; }
  dt { text-align: right; }
  dd { margin: 0; font-size: 13px; color: #c9cfdb; align-self: center; }

  kbd {
    display: inline-block;
    background: #262b34; border: 1px solid #3a4150; border-bottom-width: 2px;
    border-radius: 5px; padding: 2px 7px;
    font: 600 12px Consolas, monospace; color: #e8eaed;
    white-space: nowrap;
  }
  .gone kbd { background: #2a1d1d; border-color: #5a2b2b; color: #8d8d8d; text-decoration: line-through; }
  .gone dd { color: #c45b5b; }

  footer {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid #2c313b;
    font-size: 11.5px; color: #959cab; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Zemo shortcuts</h1>
      <span class="dismiss"><kbd>Esc</kbd> or <kbd>Ctrl+Alt+/</kbd> to close</span>
    </header>
    <p class="lede">This window is excluded from screen capture — nobody on the call sees it.</p>

    <div class="scroll" id="body">Loading…</div>

    <footer id="foot"></footer>
  </div>

<script>
  const { invoke } = window.__TAURI__.core;

  function group(list, scope) {
    // De-duplicate by description: Ctrl+Alt+/ and Ctrl+Alt+? do the same thing,
    // and listing both as separate rows reads like there are more to remember.
    const seen = new Map();
    for (const b of list.filter((b) => b.scope === scope)) {
      const key = b.desc + "|" + b.ok;
      if (seen.has(key)) seen.get(key).keys.push(b.keys);
      else seen.set(key, { ...b, keys: [b.keys] });
    }
    return [...seen.values()];
  }

  function render(rows) {
    return `<dl>${rows.map((r) => `
      <div style="display:contents" class="${r.ok ? "" : "gone"}">
        <dt>${r.keys.map((k) => `<kbd>${k}</kbd>`).join(" <span style='color:#5c6474'>or</span> ")}</dt>
        <dd>${r.desc}${r.ok ? "" : " — unavailable, another app owns this combo"}</dd>
      </div>`).join("")}</dl>`;
  }

  invoke("shortcut_list").then((list) => {
    const globals = group(list, "global");
    const drawing = group(list, "drawing");
    document.getElementById("body").innerHTML =
      `<h2>Anywhere</h2>${render(globals)}` +
      `<h2>While drawing</h2>${render(drawing)}`;

    const dead = globals.filter((r) => !r.ok).length;
    document.getElementById("foot").textContent = dead
      ? `${dead} shortcut${dead > 1 ? "s" : ""} could not be registered — another app claimed ${dead > 1 ? "them" : "it"} first. The control panel has buttons for everything.`
      : "Tools and marks are listed under “While drawing” — those keys only reach the overlay while draw mode is armed.";
  });

  // Esc closes, and so does clicking anywhere on the card: this is a glance-at
  // reference, so getting rid of it should never need aiming.
  addEventListener("keydown", (e) => {
    if (e.key === "Escape") invoke("toggle_help");
  });
  addEventListener("click", () => invoke("toggle_help"));
</script>
</body>
</html>
