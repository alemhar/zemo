<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title></title>
<style>
  /* Everything below must composite over a genuinely transparent surface.
     If any ancestor paints a background, the spike result is meaningless. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    cursor: default;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  :root { --accent: #FF2D2D; }

  /* A 6px frame proves the overlay really covers the whole monitor —
     if a side is missing, the chrome compensation in main.rs is off. */
  .frame {
    position: fixed; inset: 0;
    border: 6px solid var(--accent);
    box-sizing: border-box;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .corner {
    position: fixed; width: 90px; height: 90px;
    border: 6px solid var(--accent);
  }
  .tl { top: 24px; left: 24px; border-right: 0; border-bottom: 0; }
  .tr { top: 24px; right: 24px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 24px; left: 24px; border-right: 0; border-top: 0; }
  .br { bottom: 24px; right: 24px; border-left: 0; border-top: 0; }

  .center {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    /* Dark halo so the text survives on top of light desktops too */
    text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.9);
  }

  .headline {
    font-size: 54px; font-weight: 800; letter-spacing: -1px;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .sub {
    font-size: 22px; font-weight: 600; color: #fff; margin: 0 0 22px;
  }

  /* Live clock with milliseconds: a frozen or cached frame is immediately
     obvious to the person watching the share. */
  .clock {
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 40px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,.55);
    padding: 10px 22px; border-radius: 10px;
    display: inline-block;
    border: 2px solid var(--accent);
  }

  /* A sweeping dot proves motion survives the capture + encode pipeline. */
  .track {
    position: fixed; left: 0; right: 0; top: 140px; height: 34px;
  }
  .dot {
    position: absolute; top: 0;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 22px var(--accent);
    animation: sweep 3.2s linear infinite;
  }
  @keyframes sweep {
    0%   { left: 0 }
    50%  { left: calc(100% - 34px) }
    100% { left: 0 }
  }

  .arrow { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); }

  .legend {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    font-size: 16px; color: #fff; background: rgba(0,0,0,.6);
    padding: 8px 18px; border-radius: 8px; letter-spacing: .3px;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="track"><div class="dot"></div></div>

  <div class="center">
    <p class="headline">ZEMO OVERLAY</p>
    <p class="sub">If you can read this on the shared screen, Phase&nbsp;0 PASSES</p>
    <div class="clock" id="clock">--:--:--.---</div>
  </div>

  <svg class="arrow" width="300" height="90" viewBox="0 0 300 90" fill="none">
    <!-- Head-first arrow (PRD R6.0): the point is what matters, so it leads. -->
    <path d="M14 45 L120 45" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M8 45 L48 24 L40 45 L48 66 Z" fill="var(--accent)"/>
    <text x="140" y="54" fill="#fff" font-size="26" font-weight="700"
          style="text-shadow:0 2px 10px rgba(0,0,0,.9)">head-first</text>
  </svg>

  <div class="legend" id="legend">overlay • click-through • NOT capture-excluded</div>

<script>
  const clock = document.getElementById("clock");
  function tick() {
    const d = new Date();
    const p = (n, w = 2) => String(n).padStart(w, "0");
    clock.textContent =
      `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
    requestAnimationFrame(tick);
  }
  tick();

  // The control panel can change the accent colour mid-call. Say the colour out
  // loud, have the viewer confirm it changed — that rules out them looking at a
  // stale thumbnail or a cached frame.
  const { event } = window.__TAURI__ ?? {};
  if (event) {
    event.listen("set-color", (e) => {
      document.documentElement.style.setProperty("--accent", e.payload);
    });
  }
</script>
</body>
</html>
