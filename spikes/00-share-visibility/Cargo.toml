[package]
name = "zemo-spike-share-visibility"
version = "0.1.0"
description = "Phase 0 spike: does a transparent always-on-top overlay appear in a Teams/Zoom monitor share?"
authors = ["Alemhar Salihuddin"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[profile.dev]
debug = 0
split-debuginfo = "unpacked"
